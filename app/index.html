<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0d10">
<title>Simba</title>
<style>
  /* ------------------------------------------------------------------------
     Simba, in Claude's design language.

     The previous sheet had three faults that made the app feel unfinished, and
     all three were layout rather than taste:

       main had no max-width, so on a 2560px monitor a row of cards stretched
       the full width of the screen and every line of text ran to 200 characters.

       .msg was capped at max-width:92%, which is a phone measurement. On a
       desktop it made a two-word reply span almost the entire window, which is
       what "chat renders weirdly" was.

       Nothing constrained reading measure anywhere, so prose, tables and chat
       all shared the same unbounded column.

     The palette is Claude's: warm neutrals rather than blue-black, a coral
     accent, and near-black warm text. Amber-on-slate read as a terminal theme
     rather than a product.
     ------------------------------------------------------------------------ */
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}

  :root{
    /* Warm neutrals. The greys carry a slight ochre bias so they sit with the
       accent instead of fighting it — a pure grey next to coral reads cold. */
    --bg:#F5F4EF; --panel:#FFFFFF; --panel2:#F0EEE7; --line:#E3E0D8;
    --fg:#1F1E1D; --dim:#5E5D58; --faint:#78766F;
    --accent:#C4643C; --accent-soft:#F6EAE3; --accent-line:#E5C4B3; --link:#A84A28;
    /* Filled buttons need their own fill. The brand coral is ~4:1 on white,
       which fails WCAG AA for the label on Send / Find / Panic — the most
       prominent controls on the page. The fill is a darker terracotta so
       cream text clears 4.5:1; the coral stays for links, pills, selection. */
    --accent-fill:#7A341F; --on-accent:#F5F4EF;
    --danger-fill:#8A322C; --on-danger:#F5F4EF;
    --ok:#3F7F5B; --warn:#9A6D18; --err:#B4453F; --info:#3A6E96;
    --ok-soft:#E7F1EA; --warn-soft:#F7EEDC; --err-soft:#F8E9E7; --info-soft:#E7EFF6;
    --shadow:0 1px 2px rgba(31,30,29,.05), 0 1px 3px rgba(31,30,29,.04);
    --mono:ui-monospace,"Cascadia Code",Consolas,monospace;
    --sans:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,sans-serif;
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
    /* One place decides how wide anything gets. */
    --page:1180px; --read:56rem;
  }

  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#232220; --panel:#2E2D2A; --panel2:#383632; --line:#403E3A;
      --fg:#F2F0EA; --dim:#BAB6AC; --faint:#9A968C;
      --accent:#D97757; --accent-soft:#3A2B24; --accent-line:#5C4034; --link:#E89476;
      --accent-fill:#D97757; --on-accent:#1F1E1D;
      --danger-fill:#D97570; --on-danger:#1F1E1D;
      --ok:#5FAE83; --warn:#C99A3B; --err:#E58B84; --info:#6BA3CC;
      --ok-soft:#1F2E26; --warn-soft:#332915; --err-soft:#33211F; --info-soft:#1E2A33;
      --shadow:0 1px 2px rgba(0,0,0,.28), 0 1px 3px rgba(0,0,0,.22);
    }
  }
  :root[data-theme="dark"]{
    --bg:#232220; --panel:#2E2D2A; --panel2:#383632; --line:#403E3A;
    --fg:#F2F0EA; --dim:#BAB6AC; --faint:#9A968C;
    --accent:#D97757; --accent-soft:#3A2B24; --accent-line:#5C4034; --link:#E89476;
    --accent-fill:#D97757; --on-accent:#1F1E1D;
    --danger-fill:#D97570; --on-danger:#1F1E1D;
    --ok:#5FAE83; --warn:#C99A3B; --err:#E58B84; --info:#6BA3CC;
    --ok-soft:#1F2E26; --warn-soft:#332915; --err-soft:#33211F; --info-soft:#1E2A33;
    --shadow:0 1px 2px rgba(0,0,0,.28), 0 1px 3px rgba(0,0,0,.22);
  }

  html,body{height:100%}
  body{
    background:var(--bg);color:var(--fg);
    font:15px/1.55 var(--sans);
    display:flex;flex-direction:column;overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }

  /* ── chrome ─────────────────────────────────────────────────────────── */
  header{
    display:flex;align-items:center;gap:14px;
    padding:11px max(18px,calc((100vw - var(--page))/2));
    padding-top:calc(11px + env(safe-area-inset-top));
    background:var(--panel);border-bottom:1px solid var(--line);flex-shrink:0;
  }
  .brand{
    font-family:var(--serif);font-size:19px;font-weight:600;letter-spacing:-.01em;
    color:var(--fg);text-transform:none;
  }
  .stats{display:flex;gap:16px;font-size:12.5px;color:var(--dim);flex-wrap:wrap;flex:1;align-items:center;min-width:0}
  .stats b{color:var(--fg);font-weight:600;font-variant-numeric:tabular-nums}
  .dot{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:6px;vertical-align:1px}
  .dot.on{background:var(--ok)} .dot.off{background:var(--faint)}

  nav{
    display:flex;gap:2px;flex-shrink:0;overflow-x:auto;
    padding:0 max(18px,calc((100vw - var(--page))/2));
    background:var(--panel);border-bottom:1px solid var(--line);
    scrollbar-width:none;
  }
  nav::-webkit-scrollbar{display:none}
  nav button{
    border:none;background:transparent;color:var(--dim);
    padding:9px 13px 10px;white-space:nowrap;border-radius:0;
    border-bottom:2px solid transparent;font-size:13.5px;font-weight:500;
  }
  nav button:hover{color:var(--fg)}
  nav button.sel{color:var(--fg);font-weight:600;border-bottom-color:var(--accent)}

  main{
    flex:1;overflow-y:auto;overflow-x:hidden;
    padding:20px max(18px,calc((100vw - var(--page))/2)) 48px;
    -webkit-overflow-scrolling:touch;
  }

  /* ── controls ───────────────────────────────────────────────────────── */
  button{
    font:inherit;font-size:13.5px;color:var(--fg);background:var(--panel);
    border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer;
    transition:background .12s ease,border-color .12s ease;
  }
  button:hover{background:var(--panel2)}
  button:active{transform:translateY(.5px)}
  button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  button.primary{background:var(--accent-fill);color:var(--on-accent);border-color:var(--accent-fill);font-weight:600}
  button.primary:hover{filter:brightness(1.06);background:var(--accent-fill)}
  button.danger{background:var(--danger-fill);color:var(--on-danger);border-color:var(--danger-fill);font-weight:600}
  input,textarea{
    font:inherit;font-size:14px;color:var(--fg);background:var(--panel);
    border:1px solid var(--line);border-radius:8px;padding:8px 11px;width:100%;
  }
  input:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  input::placeholder,textarea::placeholder{color:var(--faint)}

  /* ── cards ──────────────────────────────────────────────────────────── */
  .grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(320px,1fr))}
  .card{
    background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:14px 16px;box-shadow:var(--shadow);
  }
  .card h3{
    font-size:14.5px;font-weight:600;letter-spacing:-.005em;
    display:flex;align-items:center;gap:8px;margin-bottom:3px;
  }
  .card .sub{color:var(--dim);font-size:13px;margin-bottom:10px;max-width:62ch}
  .row{display:flex;justify-content:space-between;align-items:center;gap:10px}
  .meta{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--faint);margin-top:10px}
  .meta b{color:var(--dim);font-weight:500;font-variant-numeric:tabular-nums}

  /* A section title, so a page reads as sections rather than a heap of cards. */
  .sec{
    font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--faint);
    font-weight:600;margin:22px 0 10px;display:flex;justify-content:space-between;align-items:center;
  }
  .sec:first-child{margin-top:0}

  /* ── state ──────────────────────────────────────────────────────────── */
  .pill{
    font-size:10.5px;padding:2px 8px;border-radius:99px;border:1px solid transparent;
    background:var(--panel2);color:var(--dim);
    text-transform:uppercase;letter-spacing:.05em;font-weight:600;white-space:nowrap;
  }
  .pill.running,.pill.available,.pill.completed{background:var(--ok-soft);color:var(--ok)}
  .pill.idle{background:var(--panel2);color:var(--dim)}
  .pill.waiting_limit,.pill.limited,.pill.paused,.pill.blocked{background:var(--warn-soft);color:var(--warn)}
  .pill.failed,.pill.error,.pill.logged_out,.pill.cancelled{background:var(--err-soft);color:var(--err)}
  .pill.t0{background:var(--accent-soft);color:var(--link);border-color:var(--accent-line)}
  .pill.high{color:var(--accent)} .pill.mid{color:var(--info)} .pill.cheap{color:var(--dim)}

  .bar{height:5px;background:var(--panel2);border-radius:99px;overflow:hidden;margin-top:9px}
  .bar > i{display:block;height:100%;background:var(--info);border-radius:99px}

  /* When a thread is open, main must stop being a second scroller. The
     previous height:calc(100vh - 190px) fought main's own overflow and the
     page scrolled while the composer drifted off-screen — that is "chat
     sessions render weirdly" on a desktop window. */
  body.thread-open main{
    overflow:hidden;padding-bottom:16px;
    display:flex;flex-direction:column;
  }
  /* ── chat ───────────────────────────────────────────────────────────── */
  .thread{
    display:flex;flex-direction:column;flex:1;min-height:0;
    max-width:var(--read);margin:0 auto;width:100%;
  }
  .msgs{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:14px;padding-bottom:10px}
  .msg{
    border-radius:18px 18px 6px 18px;padding:11px 14px;white-space:pre-wrap;
    max-width:min(36rem,88%);font-size:15px;line-height:1.65;
    overflow-wrap:anywhere;
  }
  .msg.user{align-self:flex-end;background:var(--accent-soft);border:1px solid var(--accent-line)}
  .msg.assistant{
    align-self:stretch;max-width:min(46rem,100%);
    background:transparent;border:none;box-shadow:none;padding:4px 2px;
    border-radius:0;white-space:normal;
  }
  .msg code{
    font-family:var(--mono);font-size:.9em;background:var(--panel2);
    padding:.12em .38em;border-radius:4px;
  }
  .msg pre.code{
    background:var(--panel2);border:1px solid var(--line);border-radius:10px;
    padding:12px 14px;overflow-x:auto;font-family:var(--mono);font-size:13px;
    line-height:1.45;margin:10px 0;white-space:pre-wrap;
  }
  .msg.system{
    align-self:center;background:transparent;border:none;color:var(--faint);
    font-size:12.5px;max-width:56ch;text-align:center;padding:2px 0;
  }
  /* A tool call. One line, and it stays one line.
     Dropped when this sheet was rewritten, so these fell back to unstyled and
     set the message column scrolling sideways: the args are JSON full of
     escaped Windows paths, which is exactly the string that never breaks. It is
     a note about what the agent did, not something to read — truncate it. */
  .tool{
    align-self:flex-start;max-width:min(46rem,88%);
    font-family:var(--mono);font-size:12px;color:var(--faint);
    background:var(--panel2);border:1px solid var(--line);border-radius:8px;
    padding:5px 10px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .tool.err{color:var(--err);background:var(--err-soft);border-color:transparent}

  .composer{
    display:flex;gap:8px;align-items:flex-end;flex-shrink:0;
    padding:8px 10px 8px 14px;margin-top:8px;
    background:var(--panel);border:1px solid var(--line);border-radius:18px;
    box-shadow:var(--shadow);
  }
  .composer textarea{
    resize:none;min-height:42px;max-height:180px;border:none;background:transparent;
    padding:8px 4px;box-shadow:none;
  }
  .composer textarea:focus{outline:none;border:none;box-shadow:none}

  /* ── misc ───────────────────────────────────────────────────────────── */
  /* The only way out of a detail view, and it had no rule at all — a bare span
     that rendered as body text. Nothing said it was clickable except its
     leading arrow. */
  .back{
    display:inline-flex;align-items:center;gap:6px;
    font-size:13px;color:var(--dim);cursor:pointer;
    padding:5px 10px 5px 8px;margin-bottom:12px;border-radius:8px;
    border:1px solid transparent;user-select:none;
  }
  .back:hover{color:var(--fg);background:var(--panel2);border-color:var(--line)}

  /* Debug lines are the bulk of the event log and the least interesting part
     of it, so they recede rather than competing with warnings. */
  .sev-debug{color:var(--faint)}

  .empty{
    color:var(--dim);text-align:center;padding:44px 20px;font-size:14px;
    max-width:52ch;margin:0 auto;
  }
  .mono{font-family:var(--mono);font-size:12.5px}
  .scroll-x{overflow-x:auto;max-width:100%}
  .swap{font-family:var(--mono);font-size:11.5px;color:var(--faint)}
  .sev-warn{color:var(--warn)} .sev-error{color:var(--err)} .sev-escalated{color:var(--err)}
  /* Links get their own colour, not the brand coral.
     The coral is 4.41:1 on a card — fine for a heading, under AA for the 12px
     "source" link in a reel's metadata, which is the size links actually appear
     at here. */
  a{color:var(--link);text-underline-offset:2px}

  /* The two lines on the brief that are actually addressed to you. They were
     set in the dimmest style on the screen, which is backwards: everything else
     in that card is context for these. */
  .needs,.stuck{
    margin-top:11px;padding:9px 12px;border-radius:8px;font-size:13.5px;line-height:1.5;
    display:flex;flex-direction:column;gap:2px;
  }
  .needs{background:var(--accent-soft);border:1px solid var(--accent-line)}
  .stuck{background:var(--warn-soft);color:var(--warn)}
  .needs > span,.stuck > span{color:var(--fg);font-weight:400}
  .needs{color:var(--accent)}

  /* Prose and search results read, so they get a measure. */
  .reading{max-width:var(--read);margin:0 auto}

  /* A card sitting directly in main is prose — the brief, a detail panel — and
     without this it inherits the full 1180px column and sets ~150-character
     lines. Cards inside .grid are unaffected; they are already sized by their
     track. Tables opt out via .scroll-x, because a data table genuinely wants
     the width and scrolls itself when it runs out. */
  main > .card:not(.scroll-x){max-width:var(--read)}
  .card p{max-width:68ch}

  .composer{flex-shrink:0}
  #kill{color:var(--err);border-color:transparent;background:transparent}
  #kill:hover{background:var(--err-soft);border-color:transparent}

  /* Desktop: a rail, like Claude. Twelve top tabs is a phone pattern and it
     is why the chrome felt like a dashboard dumped into a browser. */
  @media (min-width: 960px){
    body{
      display:grid;
      grid-template-columns:232px minmax(0,1fr);
      grid-template-rows:auto minmax(0,1fr);
    }
    header{
      grid-column:2;grid-row:1;
      padding:11px 22px;
    }
    header .brand{display:none}
    nav{
      grid-column:1;grid-row:1 / -1;
      flex-direction:column;align-items:stretch;
      overflow-x:hidden;overflow-y:auto;
      padding:18px 14px 20px;
      border-bottom:none;border-right:1px solid var(--line);
      gap:1px;
    }
    nav::before{
      content:"Simba";
      font-family:var(--serif);font-size:20px;font-weight:600;letter-spacing:-.01em;
      color:var(--fg);padding:6px 12px 16px;
    }
    nav button{
      text-align:left;border-radius:8px;border-bottom:none;padding:8px 12px;
    }
    nav button.sel{
      background:var(--accent-soft);color:var(--fg);
      border-bottom-color:transparent;
    }
    main{
      grid-column:2;grid-row:2;
      padding:22px 28px 40px;
    }
    body.thread-open main{padding-bottom:16px}
  }

  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<header>
  <span class="brand">Simba</span>
  <div class="stats" id="stats"></div>
  <button id="theme" title="Switch theme">Theme</button>
  <button class="danger" id="panic">Panic</button>
</header>

<nav>
  <button data-tab="find" class="sel">Find</button>
  <button data-tab="missions">Missions</button>
  <button data-tab="agents">Agents</button>
  <button data-tab="sessions">Sessions</button>
  <button data-tab="brains">Brains</button>
  <button data-tab="requests">Requests</button>
  <button data-tab="projects">Projects</button>
  <button data-tab="reels">Reels</button>
  <button data-tab="memory">Memory</button>
  <button data-tab="docs">Docs</button>
  <button data-tab="router">Router</button>
  <button data-tab="events">Events</button>
</nav>

<main id="main"></main>

<script>
const $ = (id) => document.getElementById(id);
const api = async (p, opts) => {
  const r = await fetch(p, { headers: { 'content-type': 'application/json' }, ...opts });
  const text = await r.text();
  let data = null;
  try { data = text ? JSON.parse(text) : null; } catch { data = text; }
  if (!r.ok) {
    const msg = (data && (data.detail || data.error || data.message)) || text || `${r.status}`;
    throw new Error(msg);
  }
  return r.status === 204 ? null : data;
};

const applyTheme = () => {
  const t = localStorage.getItem('simba-theme') || 'system';
  if (t === 'system') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme', t);
  const btn = $('theme');
  if (btn) btn.textContent = t === 'dark' ? 'Light' : t === 'light' ? 'System' : 'Dark';
};
applyTheme();
const esc = (s) => String(s ?? '').replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
const md = (s) => {
  const fences = [];
  let h = esc(s).replace(/```[a-zA-Z0-9_-]*\n?([\s\S]*?)```/g, (_, code) => {
    fences.push(`<pre class="code"><code>${code.replace(/\n$/, '')}</code></pre>`);
    return `\0${fences.length - 1}\0`;
  });
  h = h.replace(/`([^`\n]+)`/g, '<code>$1</code>');
  h = h.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  h = h.replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noreferrer">$1</a>');
  h = h.replace(/\n/g, '<br>');
  return h.replace(/\0(\d+)\0/g, (_, i) => fences[i]);
};
const ago = (t) => {
  if (!t) return 'never';
  const s = (Date.now() - new Date(t)) / 1000;
  if (s < 60) return `${s | 0}s ago`;
  if (s < 3600) return `${(s / 60) | 0}m ago`;
  if (s < 86400) return `${(s / 3600) | 0}h ago`;
  return `${(s / 86400) | 0}d ago`;
};
const until = (t) => {
  if (!t) return '';
  const s = (new Date(t) - Date.now()) / 1000;
  if (s <= 0) return 'now';
  if (s < 3600) return `${(s / 60) | 0}m`;
  return `${(s / 3600) | 0}h ${((s % 3600) / 60) | 0}m`;
};
const usd = (n) => {
  // Two decimals, and cents only when there are cents to show. Four decimals on
  // every figure made a $25 budget read as $25.0000, which looks like a machine
  // printing a float rather than a number a person set.
  const v = Number(n || 0);
  return '$' + (Number.isInteger(v) ? v.toFixed(0) : v.toFixed(2));
};

let tab = 'find';
let openSession = null;
let sessionsExpanded = false;
let live = { messages: [], sessionId: null };

// ---------------------------------------------------------------------------
// Live stream. Brain swaps and limit events surface inline in the thread so a
// model change is visible where it happened, not buried in a log.
// ---------------------------------------------------------------------------
function connect() {
  const ws = new WebSocket(`${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/ws`);
  ws.onmessage = (m) => {
    const msg = JSON.parse(m.data);
    if (msg.type === 'session_event' && msg.sessionId === openSession) {
      appendLive(msg.event);
    }
    if (msg.type === 'brain_swapped' || msg.type === 'exhausted' || msg.type === 'panic') {
      if (openSession) appendSwapNotice(msg);
      refreshStats();
    }
  };
  ws.onclose = () => setTimeout(connect, 3000);
}

function appendLive(e) {
  const box = $('msgs');
  if (!box) return;
  const atBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 120;

  if (e.kind === 'text' && e.role === 'assistant' && e.partial && e.text) {
    let stream = $('stream');
    if (!stream) {
      stream = document.createElement('div');
      stream.className = 'msg assistant';
      stream.id = 'stream';
      box.appendChild(stream);
    }
    stream.textContent += e.text;
    if (atBottom) box.scrollTop = box.scrollHeight;
    return;
  }

  const el = document.createElement('div');

  if (e.kind === 'text' && !e.partial && e.text?.trim()) {
    if (e.role === 'system') {
      el.className = 'msg system';
      el.textContent = e.text;
    } else if (e.role === 'assistant') {
      const stream = $('stream');
      if (stream) {
        stream.id = '';
        stream.innerHTML = md(e.text);
        if (atBottom) box.scrollTop = box.scrollHeight;
        return;
      }
      el.className = 'msg assistant';
      el.innerHTML = md(e.text);
    } else {
      el.className = `msg ${e.role}`;
      el.textContent = e.text;
    }
  } else if (e.kind === 'tool_call') {
    el.className = 'tool';
    el.textContent = `▸ ${e.name}`;
  } else if (e.kind === 'tool_result') {
    if (!e.isError) return;
    el.className = 'tool err';
    el.textContent = `✕ ${(e.resultText ?? 'tool failed').slice(0, 180)}`;
  } else if (e.kind === 'rate_limit' && e.status !== 'allowed') {
    el.className = 'swap';
    el.textContent = `⚠ usage limit (${e.limitType ?? '?'}) — resets ${until(e.resetsAt)}`;
  } else {
    return;
  }
  box.appendChild(el);
  if (atBottom) box.scrollTop = box.scrollHeight;
}

function appendSwapNotice(msg) {
  const box = $('msgs');
  if (!box) return;
  const el = document.createElement('div');
  el.className = 'swap';
  el.textContent =
    msg.type === 'exhausted'
      ? `⏸ every brain exhausted — sleeping until ${msg.sleepUntil ? new Date(msg.sleepUntil).toLocaleTimeString() : 'reset'}, work resumes automatically`
      : msg.type === 'panic'
        ? `■ panic stop — ${msg.killed} sessions killed`
        : `⇄ brain swapped (${msg.mode === 'resume' ? 'lossless resume' : 'rehydrated'}) — continuing the same work`;
  box.appendChild(el);
  box.scrollTop = box.scrollHeight;
}

async function renderSessions() {
  if (openSession) return renderThread();
  const sessions = await api('/api/sessions');
  if (!sessions.length) { $('main').innerHTML = `<div class="empty">No sessions yet. Start an agent.</div>`; return; }

  // Grouped, and the tail is folded away.
  //
  // This dumped all eighty-seven sessions as one flat grid, so the two that are
  // actually running sat somewhere in the middle of eighty that finished weeks
  // ago. The question this tab answers is "what is happening", and a list
  // ordered only by time answers "what has ever happened" instead.
  const live = sessions.filter((s) => ['running', 'idle', 'pending'].includes(s.status));
  const rest = sessions.filter((s) => !['running', 'idle', 'pending'].includes(s.status));
  const shown = sessionsExpanded ? rest : rest.slice(0, 12);

  const card = (s) => `
    <div class="card" data-open="${s.id}" style="cursor:pointer">
      <div class="row">
        <h3>${esc(s.title ?? s.agent)}</h3>
        <span class="pill ${s.status}">${s.status.replace('_', ' ')}</span>
      </div>
      <div class="sub">${esc(s.description ?? s.cwd ?? '')}</div>
      <div class="meta">
        <span><b>${esc(s.agent)}</b></span>
        ${s.brain ? `<span>${esc(s.brain)}</span>` : ''}
        ${s.swap_count > 0 ? `<span style="color:var(--accent)">⇄ ${s.swap_count} swap${s.swap_count > 1 ? 's' : ''}</span>` : ''}
        ${s.hydrated_from_session_id ? `<span style="color:var(--accent)">continued</span>` : ''}
        <span>${usd(s.total_cost_usd)}</span>
        <span>${ago(s.last_activity_at ?? s.created_at)}</span>
      </div>
    </div>`;

  $('main').innerHTML = `
    ${live.length
      ? `<div class="sec">Live now<span>${live.length}</span></div><div class="grid">${live.map(card).join('')}</div>`
      : `<div class="sec">Live now</div><div class="empty" style="padding:22px">Nothing running. Start an agent from Missions or Chat.</div>`}
    <div class="sec">Finished<span>${rest.length} total</span></div>
    <div class="grid">${shown.map(card).join('')}</div>
    ${rest.length > shown.length
      ? `<div style="text-align:center;margin-top:14px"><button id="moresess">Show all ${rest.length}</button></div>`
      : ''}`;

  $('main').querySelectorAll('[data-open]').forEach((c) =>
    c.onclick = () => { openSession = c.dataset.open; render(); });
  const more = $('moresess');
  if (more) more.onclick = () => { sessionsExpanded = true; render(); };
}

async function renderThread() {
  const id = openSession;
  const [messages, tools, turns, checkpoints] = await Promise.all([
    api(`/api/sessions/${id}/messages`),
    api(`/api/sessions/${id}/tools`),
    api(`/api/sessions/${id}/turns`),
    api(`/api/sessions/${id}/checkpoints`),
  ]);

  // Interleave messages and tool calls chronologically.
  const items = [
    ...messages.map((m) => ({ t: new Date(m.created_at), kind: 'msg', d: m })),
    ...tools.map((x) => ({ t: new Date(x.created_at), kind: 'tool', d: x })),
  ].sort((a, b) => a.t - b.t);

  const brainsUsed = [...new Set(turns.map((t) => t.brain).filter(Boolean))];
  const cp = checkpoints[0];

  $('main').innerHTML = `
    <div class="thread">
      <span class="back" id="back">← all sessions</span>
      ${brainsUsed.length > 1 ? `<div class="swap" style="margin-bottom:10px">This session ran across ${brainsUsed.length} brains: ${brainsUsed.join(' → ')}</div>` : ''}
      ${cp && cp.work_remaining ? `<div class="card" style="margin-bottom:10px">
        <div class="sub" style="margin:0 0 5px">Latest checkpoint — ${esc(cp.reason)}</div>
        <div style="font-size:12.5px"><b>Remaining:</b> ${esc(String(cp.work_remaining).slice(0, 300))}</div>
        ${cp.failures ? `<div style="font-size:12.5px;color:var(--warn);margin-top:5px"><b>Already failed:</b> ${esc(String(cp.failures).slice(0, 300))}</div>` : ''}
      </div>` : ''}
      <div class="msgs" id="msgs">
        ${items.map((it) => {
          if (it.kind === 'msg') {
            const role = it.d.role;
            const text = it.d.content?.trim();
            if (!text || role === 'system' || role === 'developer') return '';
            return role === 'assistant'
              ? `<div class="msg assistant">${md(text)}</div>`
              : `<div class="msg ${role}">${esc(text)}</div>`;
          }
          return `<div class="tool${it.d.is_error ? ' err' : ''}" title="${esc(it.d.name)}">${it.d.is_error ? '✕' : '▸'} ${esc(it.d.name)}</div>`;
        }).join('')}
      </div>
      <div class="composer">
        <textarea id="input" placeholder="Message this agent…" rows="1"></textarea>
        <button class="primary" id="send">Send</button>
        <button id="kill">Kill</button>
      </div>
    </div>`;

  const box = $('msgs');
  box.scrollTop = box.scrollHeight;
  $('back').onclick = () => { openSession = null; render(); };
  $('kill').onclick = async () => { await api(`/api/sessions/${id}/kill`, { method: 'POST' }); render(); };

  const send = async () => {
    const t = $('input').value.trim();
    if (!t) return;
    $('input').value = '';
    appendLive({ kind: 'text', role: 'user', text: t, partial: false });
    try { await api(`/api/sessions/${id}/send`, { method: 'POST', body: JSON.stringify({ text: t }) }); }
    catch (e) { appendLive({ kind: 'text', role: 'system', text: `send failed: ${e.message}`, partial: false }); }
  };
  $('send').onclick = send;
  const ta = $('input');
  ta.onkeydown = (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); } };
  ta.oninput = () => {
    ta.style.height = 'auto';
    ta.style.height = Math.min(ta.scrollHeight, 180) + 'px';
  };
}

        <div class="meta">
          <span><b>${m.done_steps}/${m.total_steps}</b> steps</span>
          ${m.failed_steps ? `<span class="sev-warn">${m.failed_steps} failed</span>` : ''}
          <span><b>${m.sessions_used}</b>/${m.max_sessions} sessions</span>

  $('main').querySelectorAll('[data-mission]').forEach((el) =>

    const acceptanceCriteria = prompt('How will we know it is done? (optional)') || undefined;
    const workingDir = prompt('Working directory? (optional)') || undefined;
    try {
      await api('/api/missions', { method: 'POST', body: JSON.stringify({ title, objective, acceptanceCriteria, workingDir }) });
      render();
    } catch (e) { alert(e.message); }
  };
}

// ---------------------------------------------------------------------------
// Memory: semantic search over the whole personal corpus. This is the reason
// everything gets stored — being able to ask your own history a question.
// ---------------------------------------------------------------------------
let memoryQuery = '';
let memoryHits = null;
let memorySeq = 0;

async function renderMemory() {
  const sources = await api('/api/knowledge/sources');
  const total = sources.reduce((a, s) => a + (s.chunks || 0), 0);

  $('main').innerHTML = `
    <div class="card" style="margin-bottom:10px">
      <div class="row" style="gap:8px">
        <input id="mq" placeholder="Ask your own history…" value="${esc(memoryQuery)}"
          style="flex:1;background:var(--panel2);color:var(--fg);border:1px solid var(--line);border-radius:9px;padding:10px 12px;font:inherit">
        <button class="primary" id="msearch">Search</button>
      </div>
      <div class="meta"><span><b>${total.toLocaleString()}</b> chunks indexed across ${sources.length} sources</span></div>
    </div>
    <div class="grid" style="margin-bottom:10px">
      ${sources.map((s) => `
        <div class="card">
          <div class="row"><h3>${esc(s.name)}</h3><span class="pill">${esc(s.kind)}</span></div>
          <div class="meta">
            <span><b>${(s.items || 0).toLocaleString()}</b> items</span>
            <span><b>${(s.chunks || 0).toLocaleString()}</b> chunks</span>
            <span>${s.last_ingested_at ? ago(s.last_ingested_at) : 'never ingested'}</span>
          </div>
        </div>`).join('')}
    </div>
    <div id="mres">${memoryHits === null ? '' : renderHits(memoryHits)}</div>`;

  const go = async () => {
    memoryQuery = $('mq').value.trim();
    if (!memoryQuery) return;
    const seq = ++memorySeq;
    $('mres').innerHTML = `<div class="empty">Searching…</div>`;
    try {
      const hits = await api(`/api/knowledge/search?q=${encodeURIComponent(memoryQuery)}`);
      if (seq !== memorySeq) return;
      memoryHits = hits;
      $('mres').innerHTML = renderHits(memoryHits);
    } catch (e) {
      if (seq !== memorySeq) return;
      $('mres').innerHTML = `<div class="empty">${esc(e.message)}</div>`;
    }
  };
  $('msearch').onclick = go;
  $('mq').onkeydown = (e) => { if (e.key === 'Enter') go(); };
}

function renderHits(hits) {
  if (!Array.isArray(hits)) {
    return `<div class="empty">${esc(hits?.detail || hits?.error || 'Search is unavailable.')}</div>`;
  }
  const usable = hits.filter((h) => (h.content || h.title || '').trim());
  if (!usable.length) return `<div class="empty">No matches.</div>`;
  return usable.map((h) => `
    <div class="card" style="margin-bottom:8px">
      <div class="row">
        <h3>${esc(h.title || 'untitled')}</h3>
        <span class="pill">${((h.relevance || 0) * 100).toFixed(0)}%</span>
      </div>
      <div class="sub">${esc(h.source)}</div>
      <div class="reading" style="font-size:13.5px;white-space:pre-wrap;color:var(--dim);max-width:68ch">${esc((h.content || '').slice(0, 700))}</div>
    </div>`).join('');
}

/* ---------------------------------------------------------------------------
   The four surfaces the phone had and the desktop did not.

   Requests, projects, reels and the search box were all built as gateway routes
   and Android screens, which meant the machine they actually run on was the one
   place you could not see them. Each is a plain read of an endpoint that already
   exists — no new backend.
   --------------------------------------------------------------------------- */

let findQuery = '';
let findHits = null;
let findSeq = 0;

async function renderFind() {
  $('main').innerHTML = `<div class="reading">
    <div class="row" style="gap:9px;margin-bottom:6px">
      <input id="fq" placeholder="Anything you half-remember — Ctrl+K anytime"
             value="${esc(findQuery)}" autocomplete="off">
      <button class="primary" id="fgo">Find</button>
    </div>
    <div class="sec">Requests · captures · projects · sessions · missions</div>
    <div id="fres">${findHits === null ? emptyFind() : renderFound(findHits)}</div>
  </div>`;

  const go = async () => {
    findQuery = $('fq').value.trim();
    const seq = ++findSeq;
    if (findQuery.length < 2) { findHits = null; $('fres').innerHTML = emptyFind(); return; }
    $('fres').innerHTML = `<div class="empty">Searching…</div>`;
    try {
      const hits = await api(`/api/find?q=${encodeURIComponent(findQuery)}`);
      if (seq !== findSeq) return;
      findHits = hits;
      if (!Array.isArray(findHits)) throw new Error(findHits?.error || 'search returned nothing usable');
      $('fres').innerHTML = renderFound(findHits);
      bindFound();
    } catch (e) {
      if (seq !== findSeq) return;
      $('fres').innerHTML = `<div class="empty">${esc(e.message)}</div>`;
    }
  };
  $('fgo').onclick = go;
  $('fq').onkeydown = (e) => { if (e.key === 'Enter') go(); };
  let debounce;
  $('fq').oninput = () => {
    clearTimeout(debounce);
    debounce = setTimeout(go, 280);
  };
  $('fq').focus();
  if (findHits) bindFound();
}

const emptyFind = () => `<div class="empty">This page is Simba on this PC.<br>
  Type a word you remember — requests, captures, projects, sessions, missions.
  Open a hit to go there. Notes and old chats live under Memory.
  Missions is what is running; Panic in the header stops everything.</div>`;

function openFound(h) {
  if (h.kind === 'session') { tab = 'sessions'; openSession = h.id; render(); }
  else if (h.kind === 'mission') { tab = 'missions'; openMission = h.id; render(); }
  else if (h.kind === 'request') { tab = 'requests'; render(); }
  else if (h.kind === 'project') { tab = 'projects'; render(); }
  else if (h.kind === 'capture') { tab = 'reels'; render(); }
}

function bindFound() {
  $('main').querySelectorAll('[data-found]').forEach((el) => {
    el.onclick = () => {
      const h = findHits.find((x) => x.id === el.dataset.found && x.kind === el.dataset.kind);
      if (h) openFound(h);
    };
  });
}

function renderFound(hits) {
  if (!hits.length) return `<div class="empty">Nothing matches “${esc(findQuery)}”.</div>`;
  // Outstanding first, because the question behind almost every search here is
  // "what happened to X".
  const open = hits.filter((h) => h.live);
  const rest = hits.filter((h) => !h.live);
  const row = (h) => `<div class="card" data-found="${esc(h.id)}" data-kind="${esc(h.kind)}" style="margin-bottom:8px;cursor:pointer">
    <div class="row"><h3>${esc(h.title ?? '')}</h3>
      <span class="pill ${esc(h.status ?? '')}">${esc(h.kind)}</span></div>
    ${h.subtitle ? `<div class="sub">${esc(h.subtitle)}</div>` : ''}
    <div class="meta">${h.status ? `<span>${esc(h.status)}</span>` : ''}
      ${h.when_at ? `<span>${ago(h.when_at)}</span>` : ''}</div>
  </div>`;
  return (open.length ? `<div class="sec">Still open</div>${open.map(row).join('')}` : '')
       + (rest.length ? `<div class="sec">${open.length ? 'Everything else' : 'Found'}</div>${rest.map(row).join('')}` : '');
}

async function renderRequests() {
  const rows = await api('/api/requests');
  const open = rows.filter((r) => r.status === 'open');
  const done = rows.filter((r) => r.status !== 'open');
  if (!rows.length) {
    $('main').innerHTML = `<div class="empty">Nothing outstanding. Anything you ask for —
      as a note on a reel, over DM, or from the app — is kept here until it is actually done.</div>`;
    return;
  }
  // Verbatim, never summarised: these are searched for in the words they were
  // asked in, and a tidied version is one that cannot be found.
  const row = (r) => `<div class="card" style="margin-bottom:8px">
    <div class="row"><h3>${esc(r.ask)}</h3>
      <span class="pill ${esc(r.status)}">${esc(r.status)}</span></div>
    ${r.outcome ? `<div class="sub">${esc(r.outcome)}</div>` : ''}
    <div class="meta"><span>${esc(r.source)}</span><span>asked ${ago(r.created_at)}</span>
      ${r.agent ? `<span>${esc(r.agent)}</span>` : ''}</div>
    ${r.status === 'open' ? `<div class="row" style="margin-top:11px;justify-content:flex-start;gap:8px">
      <button data-req="${esc(r.id)}" data-act="done">Mark done</button>
      <button data-req="${esc(r.id)}" data-act="drop">Never mind</button></div>` : ''}
  </div>`;
  $('main').innerHTML = `<div class="reading">
    ${open.length ? `<div class="sec">You asked for<span>${open.length} open</span></div>${open.map(row).join('')}` : ''}
    ${done.length ? `<div class="sec">Answered</div>${done.map(row).join('')}` : ''}
  </div>`;
  document.querySelectorAll('[data-req]').forEach((b) => {
    b.onclick = async () => {
      b.disabled = true;
      try { await api(`/api/requests/${b.dataset.req}/${b.dataset.act}`, { method: 'POST' }); render(); }
      catch (e) { b.disabled = false; alert(e.message); }
    };
  });
}

async function renderProjects() {
  const rows = await api('/api/projects');
  const exposed = rows.filter((p) => p.at_risk);
  const unread = rows.filter((p) => p.scan_error);
  const settled = rows.filter((p) => !p.at_risk && !p.scan_error);
  const homeless = exposed.filter((p) => !p.git_remote).length;

  const row = (p) => `<div class="card" style="margin-bottom:8px">
    <div class="row"><h3>${esc(p.name)}</h3>
      ${p.scan_error ? `<span class="pill error">unreadable</span>`
        : !p.git_remote ? `<span class="pill error">no remote</span>` : ''}</div>
    <div class="sub mono">${esc(p.root_path ?? '')}</div>
    <div class="meta">
      ${p.dirty_files > 0 ? `<span class="sev-warn">${p.dirty_files} uncommitted</span>` : ''}
      ${p.unpushed > 0 ? (p.git_remote
          ? `<span class="sev-warn">${p.unpushed} unpushed</span>`
          : `<span class="sev-error">${p.unpushed} commits, nowhere else</span>`) : ''}
      ${p.branch ? `<span>${esc(p.branch)}</span>` : ''}
      ${p.last_commit_at ? `<span>${ago(p.last_commit_at)}</span>` : ''}
      ${p.owner ? `<span>${esc(p.owner)}</span>` : ''}
    </div>
    ${p.scan_error ? `<div class="sub sev-error" style="margin-top:8px">${esc(p.scan_error)}</div>` : ''}
  </div>`;

  $('main').innerHTML = `<div class="reading">
    <div class="card" style="margin-bottom:14px">
      <div class="row">
        <h3>${exposed.length === 0 ? 'Everything is published'
             : exposed.length === 1 ? '1 project holds work that’s only here'
             : `${exposed.length} projects hold work that’s only here`}</h3>
        ${exposed.length === 0 ? `<span class="pill available">clear</span>`
          : homeless ? `<span class="pill error">${homeless} with no remote</span>`
          : `<span class="pill paused">unpublished</span>`}
      </div>
      <div class="sub">${rows.length} tracked · rescanned every half hour</div>
      <button id="rescan">Rescan now</button>
    </div>
    ${exposed.length ? `<div class="sec">Only on this disk</div>${exposed.map(row).join('')}` : ''}
    ${unread.length ? `<div class="sec">Couldn’t read</div>${unread.map(row).join('')}` : ''}
    ${settled.length ? `<div class="sec">Published</div>${settled.map(row).join('')}` : ''}
  </div>`;

  $('rescan').onclick = async (e) => {
    e.target.disabled = true; e.target.textContent = 'Scanning…';
    try { await api('/api/projects/scan', { method: 'POST' }); render(); }
    catch (err) { e.target.disabled = false; e.target.textContent = 'Rescan now'; alert(err.message); }
  };
}

async function renderReels() {
  const feed = await api('/api/reels');
  const h = feed.health ?? {};
  let items = feed.items ?? [];
  if (!feed.reachable && !items.length) {
    try {
      const caps = await api('/api/captures');
      items = (caps ?? []).filter((c) => c.url || c.kind === 'reel' || c.kind === 'instagram').map((c) => ({
        id: c.id,
        title: c.title || (c.content || '').slice(0, 80) || 'Untitled',
        summary: c.summary || c.content,
        received: c.created_at,
        done: c.status !== 'pending',
        source_url: c.url,
      }));
    } catch { /* captures unavailable too */ }
  }
  const status = feed.reachable
    ? `<span class="pill available">live</span>`
    : `<span class="pill paused">agent off</span>`;
  const headline = feed.reachable
    ? (h.working > 0 ? 'Working' : 'Idle, waiting for reels')
    : 'Reel agent is not running';
  const sub = feed.reachable
    ? `listening as @${esc(h.logged_in_as ?? '?')}`
    : 'These are captures Simba already has. New Instagram DMs wait until the agent starts again.';

  if (!items.length && !feed.reachable) {
    $('main').innerHTML = `<div class="empty">${esc(sub)}</div>`;
    return;
  }

  $('main').innerHTML = `<div class="reading">
    <div class="card" style="margin-bottom:14px">
      <div class="row">
        <h3>${esc(headline)}</h3>
        ${status}
      </div>
      <div class="sub">${esc(sub)}</div>
      <div class="meta">
        ${h.working > 0 ? `<span>${h.working} in progress</span>` : ''}
        ${h.owed > 0 ? `<span class="sev-warn">${h.owed} queued</span>` : ''}
        <span>${items.length} written up</span>
      </div>
    </div>
    ${items.length ? `<div class="sec">Processed</div>` : ''}
    ${items.map((r) => `<div class="card" style="margin-bottom:8px">
      <div class="row"><h3>${esc(r.title)}</h3>
        ${r.done ? '' : `<span class="pill paused">working</span>`}</div>
      ${r.summary ? `<div class="sub">${esc(r.summary)}</div>` : ''}
      <div class="meta"><span>${esc(r.received ?? '')}</span>
        ${r.frames ? `<span>${r.frames} frames</span>` : ''}
        ${r.source_url ? `<a href="${esc(r.source_url)}" target="_blank" rel="noreferrer">source</a>` : ''}</div>
    </div>`).join('')}
  </div>`;
}

async function render() {
  document.body.classList.toggle('thread-open', tab === 'sessions' && !!openSession);
  document.querySelectorAll('nav button').forEach((b) => b.classList.toggle('sel', b.dataset.tab === tab));
  try {
    if (tab === 'find') await renderFind();
    else if (tab === 'requests') await renderRequests();
    else if (tab === 'projects') await renderProjects();
    else if (tab === 'reels') await renderReels();
    else if (tab === 'missions') await renderMissions();
    else if (tab === 'agents') await renderAgents();
    else if (tab === 'sessions') await renderSessions();
    else if (tab === 'brains') await renderBrains();
    else if (tab === 'memory') await renderMemory();
    else if (tab === 'docs') await renderDocs();
    else if (tab === 'router') await renderRouter();
    else if (tab === 'events') await renderEvents();
  } catch (e) {
    $('main').innerHTML = `<div class="empty">${esc(e.message)}</div>`;
  }
  refreshStats();
}

document.querySelectorAll('nav button').forEach((b) =>
  b.onclick = () => {
    tab = b.dataset.tab;
    if (tab !== 'sessions') { openSession = null; sessionsExpanded = false; }
    if (tab !== 'missions') openMission = null;
    render();
  });

$('theme').onclick = () => {
  const cur = localStorage.getItem('simba-theme') || 'system';
  const next = cur === 'system' ? 'dark' : cur === 'dark' ? 'light' : 'system';
  localStorage.setItem('simba-theme', next);
  applyTheme();
};

$('panic').onclick = async () => {
  if (!confirm('Stop every running agent immediately?')) return;
  const r = await api('/api/panic', { method: 'POST' });
  alert(`Stopped ${r.killed} sessions.`);
  render();
};

document.addEventListener('keydown', (e) => {
  if (!(e.ctrlKey || e.metaKey) || e.key.toLowerCase() !== 'k') return;
  e.preventDefault();
  tab = 'find';
  openSession = null;
  render().then(() => $('fq')?.focus());
});

connect();
render();
// Auto-refresh only the tabs that show live state. Memory and Docs hold search
// results and an open document, and silently re-rendering them under the user
// would discard what they were reading.
setInterval(() => {
  const liveTabs = ['missions', 'agents', 'sessions', 'brains', 'router', 'events'];
  if (!openSession && liveTabs.includes(tab)) render();
  else refreshStats();
}, 8000);
</script>
</body>
